<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeSphere</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f0f2f5; color: #333; }
        .navbar { background-color: #2c3e50; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .nav-links a { color: white; text-decoration: none; margin-left: 10px; font-weight: bold; cursor: pointer; padding: 8px 15px; border-radius: 6px; transition: background-color 0.3s; }
        .nav-links a.active { background-color: rgba(255, 255, 255, 0.2); }
        .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; text-align: center; }
        
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn { display: inline-block; margin-top: 15px; padding: 8px 16px; border-radius: 6px; font-weight: bold; text-decoration: none; background-color: #3498db; color: white; text-align: center; cursor: pointer; border: none; font-size: 0.95rem; }
        .btn:hover { background-color: #2980b9; }

        /* Grid Card yang Seragam dan Tidak Terlalu Besar */
        .game-menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-top: 1.5rem; text-align: left; }
        .game-card { background: #fff; padding: 18px; border-radius: 10px; border: 2px solid #e2e8f0; cursor: pointer; transition: transform 0.2s, border-color 0.2s; display: flex; flex-direction: column; justify-content: space-between; }
        .game-card:hover { transform: translateY(-3px); border-color: #3498db; }
        .game-card h3 { margin-top: 0; margin-bottom: 8px; color: #2c3e50; font-size: 1.1rem; }
        .game-card p { font-size: 0.9rem; color: #555; margin-bottom: 10px; }

        @media (max-width: 600px) { .navbar { flex-direction: column; } .nav-links { margin-top: 10px; } }
    </style>
</head>
<body>

    <nav class="navbar">
        <h1>CodeSphere</h1>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="misi.html" class="active">Misi</a>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h2>Pilih Misi Permainan</h2>
            <p>Pilih tantangan seru di bawah ini untuk menguji logika pemrograman Anda!</p>
            
            <div class="game-menu">
                <!-- Card Labirin -->
                <div class="game-card" onclick="window.location.href='labirin.html'">
                    <div>
                        <h3>Labirin</h3>
                        <p>Cari jalan keluar menggunakan tombol ikon panah atau keyboard.</p>
                    </div>
                    <button class="btn" style="width: 100%;">Mulai Bermain</button>
                </div>

                <!-- Card Tangkap Buah (Mengarah ke buah.html atau tangkap_buah.html sesuai nama file Anda) -->
                <div class="game-card" onclick="window.location.href='buah.html'">
                    <div>
                        <h3>Tangkap Buah</h3>
                        <p>Kumpulkan buah sebanyak mungkin dengan menggunakan tombol panah atau keyboard.</p>
                    </div>
                    <button class="btn" style="width: 100%;">Mulai Bermain</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
